name: Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  SOROBAN_RPC_URL: http://localhost:8000/soroban/rpc
  NETWORK_PASSPHRASE: "Standalone Network ; February 2017"

jobs:
  integration:
    name: Integration (live Soroban RPC node)
    runs-on: ubuntu-latest



    steps:
      - uses: actions/checkout@v4.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.79.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-
            ${{ runner.os }}-cargo-

      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall
      - name: Install stellar-cli
        run: cargo binstall -y stellar-cli@21.4.0 --bin stellar

      - name: Start stellar-quickstart
        run: |
          docker run -d --name stellar-quickstart -p 8000:8000 \
            -e ENABLE_SOROBAN_RPC=true \
            stellar/quickstart:testing@sha256:2182a7558123ff6420ea5516283616634673956530a8edf89796ebe4b58bd784 \
            --standalone --enable-soroban-rpc

      - name: Wait for Soroban RPC readiness
        run: |
          for i in $(seq 1 60); do
            if curl -s -f -X POST -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
                 "$SOROBAN_RPC_URL" | grep -q '"status":[[:space:]]*"healthy"'; then
              echo "Soroban RPC is healthy"
              exit 0
            fi
            echo "waiting for Soroban RPC ($i/60)..."
            sleep 2
          done
          echo "Soroban RPC never became healthy" >&2
          exit 1

      - name: Generate and fund the integration test account
        run: |
          IDENTITY_NAME="ci-integration"
          stellar keys generate "$IDENTITY_NAME" --network standalone --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$NETWORK_PASSPHRASE"
          PUB_KEY="$(stellar keys address "$IDENTITY_NAME")"
          curl -s "http://localhost:8000/friendbot?addr=$PUB_KEY" > /dev/null
          SECRET_KEY="$(stellar keys show "$IDENTITY_NAME")"
          echo "::add-mask::$SECRET_KEY"
          echo "STELLAR_SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: cargo test --test integration -- --ignored --test-threads=1
